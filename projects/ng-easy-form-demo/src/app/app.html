<div style="padding: 0.5rem;">
    <easy-form [form]="form" />
</div>
<div style="flex-direction: row; justify-content: center; align-items: center;">
    <button mat-raised-button (click)="save()">
        Save
    </button>
<button mat-raised-button (click)="disable.set(!this.disable())">
  {{ disable() ? 'Enable' : 'Disable' }}
</button>
</div>
